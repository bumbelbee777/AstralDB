project: AstralDB
authors: ["bumblebee777"]
license: MIT
version: 2.0
language: cpp
standard: c++23
compiler: clang++
project_type: library
project_dirs:
  - sources/Database
  - sources/SQL
  - sources/IO
  - sources/DS
output: bin/libastraldb_core.a
# InsurgeNT invokes the compiler from the repo root; use -Isources (not -I../sources) in subprojects.
compiler_flags:
  global: "-Wall -Wextra -Werror -fstack-protector-strong -fpie -Isources -Ithird_party -Iinclude -Itests"
  common: "-Os"
  cpp: "-ffunction-sections -fdata-sections"
  ar: ""
  ld: "-Wl,--stack,8388608"

unit_tests:
  project_dirs:
    - sources/API
    - tests
  output: bin/run_tests

subprojects:
  - sources/API
  - tests
  - app
