# Nightly pre-releases on main: platform CLI binaries, Quasar wheel, SHA256SUMS.
# Rolling tag `nightly` is refreshed each run; immutable `nightly-YYYYMMDD-<run>` tags history.
name: Nightly

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-24.04
            artifact: astraldb-linux-amd64
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DASTRALDB_RELEASE_PROFILE=size
              -DASTRALDB_RELEASE_DIST=ON
            build: cmake --build build-ci --target astraldb
            binary: build-ci/astraldb
            staged: dist/astraldb
            upx: true

          - name: macos-arm64
            os: macos-14
            artifact: astraldb-macos-arm64
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DASTRALDB_RELEASE_PROFILE=size
              -DASTRALDB_RELEASE_DIST=ON
            build: cmake --build build-ci --target astraldb
            binary: build-ci/astraldb
            staged: dist/astraldb
            upx: false

          - name: windows-amd64
            os: windows-latest
            artifact: astraldb-windows-amd64
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=clang++
              -DASTRALDB_RELEASE_PROFILE=size
              -DASTRALDB_RELEASE_DIST=ON
            build: cmake --build build-ci --target astraldb
            binary: build-ci/astraldb.exe
            staged: dist/astraldb.exe
            upx: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm ninja -y --no-progress

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build CLI
        run: ${{ matrix.build }}

      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp "${{ matrix.binary }}" "${{ matrix.staged }}"
          chmod +x "${{ matrix.staged }}"

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "${{ matrix.binary }}" "${{ matrix.staged }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  quasar-wheel:
    name: quasar-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: quasar-wheel
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish nightly release
    needs: [build, quasar-wheel]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup UPX
        uses: ./.github/actions/setup-upx

      - name: Stage release assets and SHA256SUMS
        env:
          REQUIRE_UPX: "1"
        run: bash .github/scripts/stage-release-assets.sh artifacts release

      - name: Set nightly tag names
        run: |
          echo "IMMUTABLE_TAG=nightly-$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "NIGHTLY_TITLE=Nightly $(date -u +%Y-%m-%d) (run ${{ github.run_number }})" >> "$GITHUB_ENV"

      - name: Remove previous rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes 2>/dev/null || true
          git push origin :refs/tags/nightly 2>/dev/null || true

      - name: Publish rolling nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: ${{ env.NIGHTLY_TITLE }}
          prerelease: true
          files: release/*
          body: |
            Automated **nightly** build from [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            | Asset | Platform |
            |-------|----------|
            | `astraldb-linux-amd64` | Linux x86_64 |
            | `astraldb-macos-arm64` | macOS Apple Silicon (arm64) |
            | `astraldb-windows-amd64.exe` | Windows x86_64 |
            | `quasar-*-py3-none-any.whl` | Quasar (Python ≥3.10) |

            Linux and Windows `astraldb` builds are **UPX-packed** for smaller downloads; macOS is not.

            ### Verify downloads

            ```bash
            sha256sum -c SHA256SUMS
            ```

            Immutable snapshot tag for this run: `${{ env.IMMUTABLE_TAG }}`.

      - name: Push immutable nightly snapshot tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ env.IMMUTABLE_TAG }}" -m "Nightly build run ${{ github.run_number }}" "${{ github.sha }}"
          git push origin "${{ env.IMMUTABLE_TAG }}"
