# Build AstralDB with CMake and run the full doctest suite (unit tests + examples/*.sql).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=g++
            build: cmake --build build-ci
            test: ctest --test-dir build-ci --output-on-failure
            cli: build-ci/astraldb
            artifact: astraldb-linux-amd64

          - name: Linux (Clang)
            os: ubuntu-24.04
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=clang++-18
            build: cmake --build build-ci
            test: ctest --test-dir build-ci --output-on-failure
            cli: build-ci/astraldb
            artifact: astraldb-linux-amd64-clang

          - name: Windows (Clang)
            os: windows-latest
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=clang++
            build: cmake --build build-ci
            test: ctest --test-dir build-ci --output-on-failure
            cli: build-ci/astraldb.exe
            artifact: astraldb-windows-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-18

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm ninja -y --no-progress

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Test
        run: ${{ matrix.test }}

      - name: Upload astraldb binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.cli }}
          if-no-files-found: error

      - name: Smoke-check CLI (torture_test.sql)
        shell: bash
        run: |
          set -euo pipefail
          CLI="${{ matrix.cli }}"
          if [[ ! -f "$CLI" ]]; then
            echo "CLI not found: $CLI" >&2
            exit 1
          fi
          "$CLI" -O2 --time-sql examples/torture_test.sql

      - name: Quasar unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest quasar/tests -q
