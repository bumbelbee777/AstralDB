# Build AstralDB with CMake; run fast-labelled ctest, torture_test.sql CLI smoke,
# neutroniumbomb 1B rows/table full-scale benchmark, and Quasar pytest.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (GCC)
            os: ubuntu-24.04
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=g++
              -DASTRALDB_RELEASE_PROFILE=size
            build: cmake --build build-ci
            test: ctest --test-dir build-ci -L fast --output-on-failure
            cli: build-ci/astraldb
            artifact: astraldb-linux-amd64
            size_check: true

          - name: Linux (Clang)
            os: ubuntu-24.04
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=clang++-18
              -DASTRALDB_RELEASE_PROFILE=size
            build: cmake --build build-ci
            test: ctest --test-dir build-ci -L fast --output-on-failure
            cli: build-ci/astraldb
            artifact: astraldb-linux-amd64-clang
            size_check: false

          - name: macOS (Clang)
            os: macos-14
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DASTRALDB_RELEASE_PROFILE=size
            build: cmake --build build-ci
            test: ctest --test-dir build-ci -L fast --output-on-failure
            cli: build-ci/astraldb
            artifact: astraldb-macos-arm64
            size_check: false

          - name: Windows (Clang)
            os: windows-latest
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=clang++
              -DASTRALDB_RELEASE_PROFILE=size
            build: cmake --build build-ci
            test: ctest --test-dir build-ci -L fast --output-on-failure
            cli: build-ci/astraldb.exe
            artifact: astraldb-windows-amd64
            size_check: false

          - name: Linux (GCC speed + SIMD)
            os: ubuntu-24.04
            configure: >-
              cmake -S . -B build-ci
              -G Ninja
              -DCMAKE_BUILD_TYPE=Release
              -DCMAKE_CXX_COMPILER=g++
              -DASTRALDB_RELEASE_PROFILE=speed
              -DASTRALDB_SIMD=avx2
            build: cmake --build build-ci
            test: ctest --test-dir build-ci -L fast --output-on-failure
            cli: build-ci/astraldb
            artifact: astraldb-linux-amd64-speed
            size_check: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ clang-18

      - name: Install toolchain (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja

      - name: Install toolchain (Windows)
        if: runner.os == 'Windows'
        run: choco install llvm ninja -y --no-progress

      - name: Configure
        run: ${{ matrix.configure }}

      - name: Build
        run: ${{ matrix.build }}

      - name: Unpacked binary size check
        if: matrix.size_check == true
        shell: bash
        run: |
          set -euo pipefail
          CLI="${{ matrix.cli }}"
          SIZE=$(stat -c%s "$CLI")
          echo "Unpacked size: $SIZE bytes"
          MAX=2900000
          if [ "$SIZE" -ge "$MAX" ]; then
            echo "Binary too large: $SIZE >= $MAX" >&2
            exit 1
          fi

      - name: Setup UPX
        if: matrix.size_check == true
        uses: ./.github/actions/setup-upx

      - name: UPX packed size check
        if: matrix.size_check == true
        shell: bash
        run: |
          set -euo pipefail
          CLI="${{ matrix.cli }}"
          OUT=$(bash scripts/measure_binary_size.sh "$CLI")
          echo "$OUT"
          PACKED=$(echo "$OUT" | awk -F= '/^upx_bytes=/{print $2}')
          if [ -n "$PACKED" ]; then
            echo "UPX packed size: $PACKED bytes"
            MAX_PACKED=1400000
            if [ "$PACKED" -ge "$MAX_PACKED" ]; then
              echo "UPX-packed binary too large: $PACKED >= $MAX_PACKED" >&2
              exit 1
            fi
          else
            echo "UPX pack ratio unavailable (measurement failed)" >&2
            exit 1
          fi

      - name: Test
        run: ${{ matrix.test }}

      - name: SHA256 checksum (CLI)
        shell: bash
        run: |
          set -euo pipefail
          CLI="${{ matrix.cli }}"
          bash .github/scripts/sha256-file.sh "$CLI" > "${CLI}.sha256"
          cat "${CLI}.sha256"

      - name: Upload astraldb binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.cli }}
            ${{ matrix.cli }}.sha256
          if-no-files-found: error

      - name: Smoke-check CLI (torture_test.sql)
        shell: bash
        run: |
          set -euo pipefail
          CLI="${{ matrix.cli }}"
          if [[ ! -f "$CLI" ]]; then
            echo "CLI not found: $CLI" >&2
            exit 1
          fi
          "$CLI" -O2 --time-sql examples/torture_test.sql

      - name: Quasar unit tests
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest quasar/tests -q

  neutroniumbomb-bench:
    name: neutroniumbomb benchmark (1B rows/table)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Configure (speed + AVX2)
        run: >-
          cmake -S . -B build-ci
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=g++
          -DASTRALDB_RELEASE_PROFILE=speed
          -DASTRALDB_SIMD=avx2

      - name: Build
        run: cmake --build build-ci

      - name: Run neutroniumbomb full benchmark (1B rows/table)
        run: |
          set -euo pipefail
          python3 scripts/benchmark_neutroniumbomb_full.py \
            --astral build-ci/astraldb \
            --rows 1000000000 \
            --full-scale \
            --queries 10,11 \
            | tee neutroniumbomb-ci.log

      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: neutroniumbomb-ci-log
          path: neutroniumbomb-ci.log
          if-no-files-found: warn

  quasar-wheel:
    name: quasar-wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist

      - name: SHA256 checksum (wheel)
        shell: bash
        run: |
          set -euo pipefail
          WHEEL=(dist/*.whl)
          sha256sum "${WHEEL[0]}" | awk -v f="$(basename "${WHEEL[0]}")" '{print $1 "  " f}' > dist/quasar-wheel.sha256
          cat dist/quasar-wheel.sha256

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: quasar-wheel
          path: dist/*
          if-no-files-found: error
